id = "agentic-dev.layout"
name = "Agentic Layout"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Three-column agent workspace: persistent agent, review/shell center, files/git sidebar"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "-p", "herdr-sidebar"]

[[startup]]
command = ["bash", "layout.sh", "startup"]

[[actions]]
id = "create"
title = "Create agentic layout"
contexts = ["workspace"]
command = ["bash", "layout.sh", "create"]

[[actions]]
id = "apply"
title = "Apply agentic layout"
contexts = ["workspace"]
command = ["bash", "layout.sh", "apply"]

[[actions]]
id = "start-agent"
title = "Start agent pane"
contexts = ["workspace"]
command = ["bash", "layout.sh", "start-agent"]

[[actions]]
id = "focus-agent"
title = "Focus agent pane"
contexts = ["workspace"]
command = ["bash", "layout.sh", "focus-agent"]

[[actions]]
id = "select-review"
title = "Select review view"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-review"]

[[actions]]
id = "close-review"
title = "Close review view"
contexts = ["workspace"]
command = ["bash", "layout.sh", "close-review"]

[[actions]]
id = "select-shell"
title = "Select shell view"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-shell"]

[[actions]]
id = "toggle-sidebar"
title = "Toggle files pane"
contexts = ["workspace"]
command = ["bash", "layout.sh", "toggle-sidebar"]

[[actions]]
id = "select-files"
title = "Files"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-files"]

[[actions]]
id = "select-source-control"
title = "Source control"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-source-control"]

[[actions]]
id = "refresh-review"
title = "Refresh review view"
contexts = ["workspace"]
command = ["bash", "layout.sh", "refresh-review"]

[[actions]]
id = "open-editor"
title = "Open file in editor"
contexts = ["workspace"]
command = ["bash", "layout.sh", "open-editor"]

[[actions]]
id = "close-tab"
title = "Close file tab"
contexts = ["workspace"]
command = ["bash", "layout.sh", "close-tab"]

[[actions]]
id = "close-pane"
title = "Close pane"
contexts = ["workspace"]
command = ["bash", "layout.sh", "close-pane"]

[[actions]]
id = "select-prev-tab"
title = "Previous tab"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-prev-tab"]

[[actions]]
id = "select-next-tab"
title = "Next tab"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-next-tab"]

# Herdr has no action key range; select-tab-1..9 are the same command with N.
[[actions]]
id = "select-tab-1"
title = "Focus tab 1"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "1"]

[[actions]]
id = "select-tab-2"
title = "Focus tab 2"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "2"]

[[actions]]
id = "select-tab-3"
title = "Focus tab 3"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "3"]

[[actions]]
id = "select-tab-4"
title = "Focus tab 4"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "4"]

[[actions]]
id = "select-tab-5"
title = "Focus tab 5"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "5"]

[[actions]]
id = "select-tab-6"
title = "Focus tab 6"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "6"]

[[actions]]
id = "select-tab-7"
title = "Focus tab 7"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "7"]

[[actions]]
id = "select-tab-8"
title = "Focus tab 8"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "8"]

[[actions]]
id = "select-tab-9"
title = "Focus tab 9"
contexts = ["workspace"]
command = ["bash", "layout.sh", "select-tab", "9"]

[[events]]
on = "pane.exited"
command = ["bash", "layout.sh", "event-pane-exited"]

[[events]]
on = "workspace.closed"
command = ["bash", "layout.sh", "event-workspace-closed"]

[[events]]
on = "tab.focused"
command = ["bash", "layout.sh", "event-tab-focused"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "layout.sh", "event-agent-status"]
