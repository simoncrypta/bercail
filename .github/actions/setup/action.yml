name: Setup
description: >-
  The setup the CI jobs share, after checkout: Node with the npm devDependencies
  (bats, vite-plus), then the pinned mise tools the job names.

inputs:
  tools:
    description: >-
      mise tool specs, space-separated, installed with `mise use -g` the way
      bercail installs them for users (lib/deps.sh). Empty: no mise.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
    - run: npm ci --ignore-scripts
      shell: bash
    # The action caches mise's data dir under a key with the tool specs in it,
    # so a pin change installs fresh. Saved in the post step, after `mise use`.
    - if: inputs.tools != ''
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        cache_key_prefix: mise-${{ inputs.tools }}
        cache_save_post: true
    - if: inputs.tools != ''
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
        TOOLS: ${{ inputs.tools }}
      run: |
        # Unquoted on purpose: one argument per tool spec.
        # shellcheck disable=SC2086
        mise use -g $TOOLS
