name: Setup
description: >-
  The setup the CI jobs share, after checkout: Node with the npm devDependencies
  (bats, vite-plus), then the pinned mise tools the job names, and what the bats
  suite needs besides.

inputs:
  tools:
    description: >-
      mise tool specs, space-separated, installed with `mise use -g` the way
      bercail installs them for users (lib/deps.sh). Empty: no mise.
    default: ''
  bats:
    description: >-
      'true' when the job runs .bats files with GNU parallel.
    default: 'false'
  statechart:
    description: Install tla-ts for the statechart suite.
    default: 'false'

runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
    # node_modules itself, keyed on Node's version, package.json and the
    # lockfile: a hit skips npm ci, and with it npm ci's check that the two
    # agree. It takes 5 to 11 seconds a job.
    - id: modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      run: npm ci --ignore-scripts
      shell: bash
    # The action caches mise's data dir under a key with the tool specs in it,
    # so a pin change installs fresh. Saved in the post step, after `mise use`.
    - if: inputs.tools != ''
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        cache_key_prefix: mise-${{ inputs.tools }}
        cache_save_post: true
    - if: inputs.tools != ''
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ github.token }}
        TOOLS: ${{ inputs.tools }}
      run: |
        # Unquoted on purpose: one argument per tool spec.
        # shellcheck disable=SC2086
        mise use -g $TOOLS
    # With GNU parallel, tests/run.sh spreads tests over two jobs per core;
    # without it, it falls back to one bats run per file. The runner image
    # ships it; fail here if that changes.
    - if: inputs.bats == 'true'
      shell: bash
      run: command -v parallel
    # tla-ts, from bercail's lockfile as lib/deps.sh installs it, for the test
    # that runs the Shep inbox's check.sh (tests/statechart.bats). No Java.
    - if: inputs.statechart == 'true'
      shell: bash
      run: |
        d="$RUNNER_TEMP/statechart"
        mkdir -p "$d"
        cp lib/statechart/package.json lib/statechart/package-lock.json "$d/"
        npm ci --prefix "$d" --ignore-scripts --omit=dev --no-audit --no-fund --no-update-notifier
        echo "TLA_TS=$d/node_modules/tla-ts/dist/cli.js" >>"$GITHUB_ENV"
