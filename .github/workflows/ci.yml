name: CI

# bercail land waits for CI on the branch. Keep a selected run in one job:
# GitHub rounds each runner up to the next minute, even an empty shard.
# Master and release tags always get the full suite (docs/development.md#ci).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Nightly, on master: the full suite, so nothing goes untested for long.
  schedule:
    - cron: '43 6 * * *'

# A newer push to the same PR or branch, master included, cancels the run it
# supersedes. A tag run never cancels: it is the release and the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# The beads tests need the real bd, pinned; check and the shards both run them.
env:
  BD_VERSION: 1.3.4

jobs:
  check:
    # The repo variable CI_TEST_RUNNER names a bigger runner's label; unset,
    # the free 4-vCPU runner. tests/run.sh sizes its jobs to the cores it gets.
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # actions: read lets the tracker check below list deps.yml's runs.
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
    env:
      SHELLCHECK_VERSION: 0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # desk_upgrade.bats updates from real release tags, and the plan
          # diffs a branch against master.
          fetch-depth: 0
      - name: Plan
        id: plan
        run: bash .github/scripts/test-plan.sh --check
      # Pinned: a newer shellcheck warns about more, and that should not turn
      # an unrelated push red. vp check and the mods' lint come from npm ci.
      # With CI set, a test fails when a tool it needs is missing (need, in
      # tests/test_helper.bash), so nothing skips here unseen.
      - uses: ./.github/actions/setup
        with:
          tools: shellcheck@${{ env.SHELLCHECK_VERSION }} ${{ steps.plan.outputs.tools }}
          bats: ${{ steps.plan.outputs.bats == '1' }}
          statechart: ${{ steps.plan.outputs.statechart == '1' }}
      - name: Lint (shellcheck, vp check, mods)
        id: lint
        run: bash tests/lint.sh
      # A warning, never a failure: the scheduled tracker has gone quiet. This
      # and the tests run when lint fails, but not when setup did (lint skipped).
      - if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        name: Dependency tracker ran in the last 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/deps-track.sh stale
      # A PR's base ref is data, never shell code. Git refs cannot contain spaces.
      - if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        name: Run tests
        env:
          PLAN: ${{ steps.plan.outputs.args }}
        run: |
          read -ra args <<<"$PLAN"
          bash tests/run.sh "${args[@]}"

  # On a full plan, a lint or Vitest failure must not hide Bats failures.
  test:
    name: test (${{ matrix.shard }}/4)
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.full == '1' }}
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # desk_upgrade.bats updates from real release tags.
          fetch-depth: 0
      - name: Plan
        id: plan
        run: bash .github/scripts/test-plan.sh --shard ${{ matrix.shard }}/4
      - if: steps.plan.outputs.run
        uses: ./.github/actions/setup
        with:
          tools: ${{ steps.plan.outputs.tools }}
          bats: true
          statechart: ${{ steps.plan.outputs.statechart == '1' }}
      - if: steps.plan.outputs.run
        name: Run tests
        run: bash tests/run.sh --shard ${{ matrix.shard }}/4

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Deploy bercail.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo '::notice::CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare deploy.'
            echo 'bercail.dev /install.sh still follows the latest release via the Worker GitHub proxy.'
            exit 0
          fi
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-0911918246a46bfced4610f39e6b7eb5}"
          npm run deploy
