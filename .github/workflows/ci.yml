name: CI

# Lint and tests run side by side on every push to master and every PR. The
# Cloudflare deploy runs only for a v* tag, once both pass: master is
# unreleased trunk, and a tag is the release. docs/development.md#ci has the
# timings, the caches, and how to turn on a bigger test runner.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same PR or branch, master included, cancels the run it
# supersedes. A tag run never cancels: it is the release and the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: 0.11.0
    steps:
      - uses: actions/checkout@v4
      # Pinned: a newer shellcheck warns about more, and that should not turn
      # an unrelated push red. vp check and the mods' lint come from npm ci.
      - uses: ./.github/actions/setup
        with:
          tools: shellcheck@${{ env.SHELLCHECK_VERSION }}
      - name: Lint (shellcheck, vp check, mods)
        run: bash tests/lint.sh

  test:
    # The repo variable CI_TEST_RUNNER names a bigger runner's label; unset,
    # the free 4-vCPU runner. tests/run.sh sizes its jobs to the cores it gets.
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      BD_VERSION: 1.3.4
    steps:
      - uses: actions/checkout@v4
        with:
          # desk_upgrade.bats updates from real release tags.
          fetch-depth: 0
      # With CI set, a test fails when a tool it needs is missing (need, in
      # tests/test_helper.bash), so nothing skips here unseen. The beads tests
      # need the real bd, pinned.
      - uses: ./.github/actions/setup
        with:
          tools: github:gastownhall/beads@${{ env.BD_VERSION }}
      # With GNU parallel, tests/run.sh runs two jobs per core. The runner
      # image has it; install it if that changes.
      - name: GNU parallel
        run: command -v parallel || { sudo apt-get update -q && sudo apt-get install -y -q parallel; }
      # The bats unit suite, then the TypeScript unit tests (vp test).
      - name: Run tests
        run: bash tests/run.sh

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Deploy bercail.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo '::notice::CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare deploy.'
            echo 'bercail.dev /install.sh still follows the latest release via the Worker GitHub proxy.'
            exit 0
          fi
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-0911918246a46bfced4610f39e6b7eb5}"
          npm run deploy
