name: CI

# Lint and tests run side by side on every push, to master or any branch, and
# every PR: Shep lands a branch on master only once its CI here passed
# (bercail land). The Cloudflare deploy runs only for a v* tag, once both
# pass: master is unreleased trunk, and a tag is the release. docs/development.md#ci has the
# timings, the caches, and how to turn on a bigger test runner.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same PR or branch, master included, cancels the run it
# supersedes. A tag run never cancels: it is the release and the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the tracker check below list deps.yml's runs.
    permissions:
      contents: read
      actions: read
    env:
      SHELLCHECK_VERSION: 0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: a newer shellcheck warns about more, and that should not turn
      # an unrelated push red. vp check and the mods' lint come from npm ci.
      - uses: ./.github/actions/setup
        with:
          tools: shellcheck@${{ env.SHELLCHECK_VERSION }}
      - name: Lint (shellcheck, vp check, mods)
        run: bash tests/lint.sh
      # A warning, never a failure: the scheduled tracker has gone quiet.
      - name: Dependency tracker ran in the last 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/deps-track.sh stale

  test:
    # The repo variable CI_TEST_RUNNER names a bigger runner's label; unset,
    # the free 4-vCPU runner. tests/run.sh sizes its jobs to the cores it gets.
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      BD_VERSION: 1.3.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # desk_upgrade.bats updates from real release tags.
          fetch-depth: 0
      # With CI set, a test fails when a tool it needs is missing (need, in
      # tests/test_helper.bash), so nothing skips here unseen. The beads tests
      # need the real bd, pinned.
      - uses: ./.github/actions/setup
        with:
          tools: github:gastownhall/beads@${{ env.BD_VERSION }}
      # With GNU parallel, tests/run.sh spreads tests over two jobs per core;
      # without it, it falls back to one bats run per file. The runner image
      # ships it; fail here if that changes.
      - name: GNU parallel
        run: command -v parallel
      # The bats unit suite, then the TypeScript unit tests (vp test).
      - name: Run tests
        run: bash tests/run.sh

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Deploy bercail.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo '::notice::CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare deploy.'
            echo 'bercail.dev /install.sh still follows the latest release via the Worker GitHub proxy.'
            exit 0
          fi
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-0911918246a46bfced4610f39e6b7eb5}"
          npm run deploy
