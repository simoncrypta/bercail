name: CI

# Tests run on every push to master and every PR. The Cloudflare deploy runs
# only for a v* tag: master is unreleased trunk, and a tag is the release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BD_VERSION: 1.3.4
    steps:
      - uses: actions/checkout@v4
        with:
          # desk_upgrade.bats updates from real release tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # The beads tests need the real bd; with CI set, a missing one fails them.
      # It goes in the way bercail installs it for users (lib/deps.sh: mise use
      # -g BEADS_MISE_SPEC), pinned, and the action caches it per version.
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-beads-${{ env.BD_VERSION }}
          cache_save_post: true
      - name: bd (beads)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise use -g "github:gastownhall/beads@$BD_VERSION" && bd version
      # With GNU parallel, tests/run.sh runs two jobs per core. The runner
      # image has it; install it if that changes.
      - name: GNU parallel
        run: command -v parallel || { sudo apt-get update -q && sudo apt-get install -y -q parallel; }
      - name: Run tests
        run: bash tests/run.sh

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Deploy Pages and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo '::notice::CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare deploy.'
            echo 'bercail.dev /install.sh still follows the latest release via the Worker GitHub proxy.'
            exit 0
          fi
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-0911918246a46bfced4610f39e6b7eb5}"
          npm run deploy
