\* The scheduler: two runs of one routine, by a tick or by hand, on a clock
\* that steps on and back over 3 ticks, with a period of 2. Shep has started.
CONSTANTS Procs = {1, 2} ProcsOnA = {1, 2} Routines = {"a"} Cap = 2 Others = 0 MaxVersion = 1 ShepAtStart = {TRUE}
CONSTANTS Ticks = TRUE MaxClock = 3 Period = 2 ClockBack = TRUE BugStaleSlot = FALSE BugNoProgress = FALSE BugEarly = FALSE
CONSTANTS BugNoLock = FALSE BugNoCap = FALSE BugStaleWrite = FALSE BugLockInChild = FALSE
CONSTANTS BugTakeOutFirst = FALSE BugNoDedup = FALSE
SPECIFICATION Spec
INVARIANTS OneRunPerRoutine AtMostCap OneEventPerChange PauseSticks ThreeFailuresPause LockOnlyWhileRunning NoLostEvent OneMessagePerEvent OneRunPerSlot NextAfterLast NotBeforeSlot
PROPERTIES EveryRunEnds
