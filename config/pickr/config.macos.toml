# herdr-pickr portable defaults (macOS) — installed only when no pickr config exists.
# Rows whose `needs` binaries are missing are hidden by pickr, so absent tuicr/hunk
# installs are fine; the browser row always works.

[pickr]
auto    = false
default = "tuicr"

[[backend]]
key = "t"
id  = "tuicr"
name = "tuicr — PR review"
run  = "tuicr pr {url}"
where = "pane"
needs = ["tuicr"]
platforms = ["github", "gitlab"]

[[backend]]
key = "h"
id  = "hunk"
name = "hunk — diff viewer"
run_github = "gh pr diff {url} --no-color | hunk patch -"
run_gitlab = "glab mr diff {url} | hunk patch -"
where = "pane"
needs = ["gh", "hunk"]
platforms = ["github", "gitlab"]

[[backend]]
key = "d"
id  = "diff"
name = "diff — plain read-only (bat)"
run_github = "gh pr diff {url} | bat --paging=always -l diff"
run_gitlab = "glab mr diff {url} | bat --paging=always -l diff"
where = "pager"
needs = ["gh", "bat"]
platforms = ["github", "gitlab"]

[[backend]]
key = "o"
id  = "browser"
name = "open in browser"
run  = "open {url}"
where = "detach"
needs = []
platforms = ["github", "gitlab"]
