[pre-start]
copy-ignored = "wt step copy-ignored"

[post-start]
herdr = """
S="{{ branch | capitalize }}_{{ repo | capitalize }}"
W="{{ worktree_path }}"

source "$HOME/.config/worktrunk/herdr-layout.sh"
# Space only — no desk agent. d/dev start a clear agent session.
# Handoff starts the agent with the task via wt_herdr_handoff_agent.
unset WT_HERDR_AGENT_PROMPT
wt_herdr_layout_create "$S" "$W"

echo "✓ Herdr space '$S' ready"
echo "  Desk: Ctrl+Shift+A agent, Ctrl+Shift+R review, Ctrl+Shift+S shell, Ctrl+Shift+F/G files/changes"
"""

[post-remove]
herdr = """
S="{{ branch | capitalize }}_{{ repo | capitalize }}"
source "$HOME/.config/worktrunk/herdr-layout.sh"
wt_herdr_layout_close "$S"
"""
