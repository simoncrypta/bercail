[pre-start]
copy-ignored = "wt step copy-ignored"

# The beads store and .bercail evidence belong to the main checkout. Their
# contents, not the folders: before 0.81 a folder holding tracked files
# (.beads/config.yaml, .bercail/policy.toml) is not excluded.
[step.copy-ignored]
exclude = [".beads/*", ".bercail/*"]

[post-start]
herdr = """
S="{{ branch | sanitize | capitalize }}_{{ repo | capitalize }}"
W="{{ worktree_path }}"

source "$HOME/.config/worktrunk/herdr-layout.sh"
# The space and its desk agent. dev starts a clear agent session.
# Handoff starts the agent with the task via wt_herdr_handoff_agent.
unset WT_HERDR_AGENT_PROMPT
wt_herdr_layout_create "$S" "$W"

echo "✓ Herdr space '$S' ready"
echo "  Desk: Ctrl+Shift+A agent, Ctrl+Shift+R review, Ctrl+Shift+S shell, Ctrl+Shift+F/G files/changes"
"""

[post-remove]
herdr = """
S="{{ branch | sanitize | capitalize }}_{{ repo | capitalize }}"
source "$HOME/.config/worktrunk/herdr-layout.sh"
wt_herdr_layout_close "$S" "{{ worktree_path }}"
"""
